<div class="app-shell">
  <aside class="sidebar">
    <a class="sidebar__brand" routerLink="/dashboard" routerLinkActive="sidebar__brand--active">
      SD-WAN Dashboard
    </a>

    <nav class="sidebar__nav">
      <a class="nav-item" routerLink="/dashboard" routerLinkActive="nav-item--active"
         [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a class="nav-item" routerLink="/organization" routerLinkActive="nav-item--active"
         [routerLinkActiveOptions]="{ exact: true }">
        Organization
      </a>
      <a class="nav-item" routerLink="/sites" routerLinkActive="nav-item--active"
         [routerLinkActiveOptions]="{ exact: true }">
        Sites
      </a>
      <a class="nav-item" routerLink="/edge-devices" routerLinkActive="nav-item--active"
         [routerLinkActiveOptions]="{ exact: true }">
        Edge Devices
      </a>
    </nav>

    <div class="sidebar__flow">
      <span class="flow__label">FLOW</span>
      <span class="flow__text">Organization → Site → Device</span>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <span class="topbar__title">Operations Summary</span>
      <span class="topbar__updated">Last updated: Just now</span>
    </header>
    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
